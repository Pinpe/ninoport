# 每次发布 Release，自动构建 Windows 版 NinoPort 并挂到发行页上。
# 产物是一个压缩包：NinoPort.exe ＋ 空的 database/ 文件夹，解压即可用。
# 也可以手动跑：Actions 页面 → Build Windows Release → Run workflow。

name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 发行包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包成单文件 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name NinoPort
          --add-data "templates;templates"
          --add-data "static;static"
          --collect-all webview
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          main.py

      - name: 组装压缩包
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || 'manual' }}
        run: |
          mkdir -p package/database
          cp dist/NinoPort.exe package/
          cp LICENSE README.md package/
          # 数据库只放空壳：仓库里的 database/ 被 .gitignore 排除，里面是真实的 API Key
          printf '{}' > package/database/instance.json
          printf '{}' > package/database/context.json
          cd package
          python -c "import os, shutil; shutil.make_archive('../NinoPort-' + os.environ['TAG'] + '-windows', 'zip', '.')"

      - name: 挂到发行页
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: NinoPort-*-windows.zip

      - name: 手动触发时先存成 artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NinoPort-windows
          path: NinoPort-*-windows.zip
